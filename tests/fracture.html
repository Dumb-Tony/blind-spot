<!doctype html><meta charset="utf-8"><title>Blind Spot fracture physics review</title><style>body{margin:0;background:#17283b;color:#f3e9d2;font:16px system-ui}header{padding:10px}button{padding:9px;margin:5px}canvas{width:100%;max-width:1280px}</style>
<header><button id="glass">Hit glass</button><button id="wood">Hit wood</button><button id="heavy">Hit concrete</button><button id="pause">Pause / resume</button><button id="reset">Reset</button><button id="audit">Audit direct routes</button><span id="report"></span></header><pre id="auditReport"></pre><canvas id="view" width="1280" height="650"></canvas>
<script src="vendor/matter.min.js"></script><script src="assets.js"></script><script src="game-data.js"></script><script src="physics.js"></script><script src="renderer.js"></script><script>
const renderer=new BlindSpotRenderer.Renderer(view),c=view.getContext('2d');let sim,paused=false;
function resetScene(){sim=new BlindSpotPhysics.Simulation({tool:'street-stone',shots:99,stars:[1,2],blocks:['glass','wood','heavy'].map((material,i)=>({x:360+i*350,y:material==='heavy'?604:540,w:material==='heavy'?90:60,h:material==='heavy'?32:160,material})),cameras:[]},e=>renderer.event(e));sim.armed=true;sim.state='won';renderer.reset();}
resetScene();reset.onclick=resetScene;pause.onclick=()=>paused=!paused;
audit.onclick=async()=>{paused=true;const routes=await fetch('qa-solutions.json').then(r=>r.json()),fail=[];for(let i=0;i<routes.length;i++){const s=new BlindSpotPhysics.Simulation(BlindSpotData.LEVELS[i]);for(const [dx,dy,tool] of routes[i].shots){if(tool)s.selectTool(tool);s.aim(220-dx,490+dy);s.launch();for(let n=0;n<1800&&s.state==='flying';n++)s.step();if(s.state==='won')break;}if(s.state!=='won')fail.push(i+1);auditReport.textContent=JSON.stringify({completed:i+1,fail});await new Promise(r=>setTimeout(r,0));}};
['glass','wood','heavy'].forEach((material,i)=>document.getElementById(material).onclick=()=>{const target=sim.blocks.find(b=>b.game.material===material),x=target?.position.x||360+i*350,y=Math.min(591,target?.position.y||540);const b=Matter.Bodies.circle(x-140,y-8,19,{density:.008,restitution:.23,friction:.8});b.game={kind:'stone',tool:'street-stone'};Matter.Body.setVelocity(b,{x:25,y:0});sim.stones.push(b);sim.add(b);paused=false;});
function frame(){if(!paused){sim.step();renderer.update?.(1/60);renderer.time+=1/60;}c.fillStyle='#213a50';c.fillRect(0,0,1280,650);c.fillStyle='#778797';c.fillRect(0,620,1280,30);sim.blocks.forEach(b=>renderer.block(b));sim.stones.forEach(b=>renderer.stone(b));
report.textContent=['glass','wood','heavy'].map(m=>{const bodies=sim.blocks.filter(b=>b.game.material===m);return m+': '+bodies.filter(b=>b.game.kind==='debris').length+' fragments'+(bodies[0]?.game.kind==='block'?' / '+Math.max(0,Math.round(bodies[0].game.hp))+' HP':'');}).join(' · ');requestAnimationFrame(frame);}frame();
</script>
